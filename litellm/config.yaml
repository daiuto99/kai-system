model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: o4-mini
    litellm_params:
      model: openai/o4-mini
      api_key: os.environ/OPENAI_API_KEY

  # Gemini slot — activate by adding GEMINI_API_KEY secret
  # - model_name: gemini-pro
  #   litellm_params:
  #     model: gemini/gemini-1.5-pro
  #     api_key: os.environ/GEMINI_API_KEY

  # Local Qwen via Ollama — DEFAULT for structural monitoring (KAI-463, KAI-459 local-first rule).
  # Use for: log triage, invariants, structural audits, schema validation,
  # capability verification, gate-fired-or-not checks. Cost: $0.
  # Do NOT use for: judgment-tier monitoring (taste, voice, brand) — that routes to Sonnet.
  - model_name: qwen-small
    litellm_params:
      model: ollama_chat/qwen2.5:3b
      api_base: http://kai-ollama:11434

  - model_name: qwen-mid
    litellm_params:
      model: ollama_chat/qwen2.5:7b
      api_base: http://kai-ollama:11434

litellm_settings:
  drop_params: true
  request_timeout: 90

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
