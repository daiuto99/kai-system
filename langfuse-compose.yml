# Langfuse v4 self-hosted observability stack — KAI-963 (AR-2)
# The per-run trace/eval instrument. Load-bearing: AR-5 cannot retire the bespoke
# spine without traces proving the Hermes equivalent works.
#
# ISOLATED by design: dedicated postgres/clickhouse/redis/minio, NOT coupled to the
# Plane task-authority DB or the Buzz stack. Tailscale-only exposure — only
# langfuse-web is published, on the Tailscale IP (100.78.94.80:3010). Every other
# service talks over the compose default network with no host port surface.
# Config + secrets live in ./langfuse.env (generated on the worker, git-ignored).
#
# Merged into the main stack via `include:` in docker-compose.yml so a single
# `docker compose` project owns it (§4.1 — one compose Docker runs from).

services:
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    container_name: langfuse-web
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      # Mac/session tooling reaches the Langfuse UI + ingestion API over Tailscale only.
      - "100.78.94.80:3010:3000"
    env_file:
      - langfuse.env
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    container_name: langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    env_file:
      - langfuse.env
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  langfuse-postgres:
    image: docker.io/postgres:17
    container_name: langfuse-postgres
    restart: unless-stopped
    env_file:
      - langfuse.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: langfuse-clickhouse
    restart: unless-stopped
    user: "101:101"
    env_file:
      - langfuse.env
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  langfuse-redis:
    image: docker.io/redis:7
    container_name: langfuse-redis
    restart: unless-stopped
    env_file:
      - langfuse.env
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction'
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_AUTH\" ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  langfuse-minio:
    image: docker.io/minio/minio
    container_name: langfuse-minio
    restart: unless-stopped
    env_file:
      - langfuse.env
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
