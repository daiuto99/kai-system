[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "destructive: kills/restarts containers, run manually only",
    "whole_repo: static guard that requires the complete kai-system checkout",
]
