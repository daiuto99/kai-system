# KAI Docker Socket Proxy — L16 privilege boundary (S5R-27)
# Intercepts all Docker API traffic and blocks container create + exec.
# Allowed: inspect, logs, restart, start, stop, kill, ps, images, volumes, info.
# Blocked: containers/create (host-bind-mount escalation), exec create/start.
#
# kai-worker-api and kai-scheduler route through this proxy.

upstream docker {
    server unix:/var/run/docker.sock;
}

server {
    listen 2375;
    server_name _;

    # L16: block container create — docker run / docker compose up both land here.
    # This is the host-bind-mount escalation path (docker run -v /etc:/x ...).
    location ~ "^(/v[0-9]+\.[0-9]+)?/containers/create" {
        default_type application/json;
        return 403 '{"message":"container create blocked by KAI socket proxy","code":"privilege_boundary","law":"L16"}';
    }

    # L16: block exec create — exec into a container running as root is equivalent escalation.
    location ~ "^(/v[0-9]+\.[0-9]+)?/containers/[^/]+/exec" {
        default_type application/json;
        return 403 '{"message":"exec create blocked by KAI socket proxy","code":"privilege_boundary","law":"L16"}';
    }

    # L16: block exec start (defense in depth — belt-and-suspenders with the create block).
    location ~ "^(/v[0-9]+\.[0-9]+)?/exec/[^/]+/start" {
        default_type application/json;
        return 403 '{"message":"exec start blocked by KAI socket proxy","code":"privilege_boundary","law":"L16"}';
    }

    # Allow all other Docker API operations: ps, inspect, logs, restart, start,
    # stop, kill, images, volumes, info, events, ping.
    location / {
        proxy_pass http://docker;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
