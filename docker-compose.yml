services:

  kai-worker-api:
    build: ./kai-worker-api
    container_name: kai-worker-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - /home/leo/vault:/vault:rw
    env_file:
      - .env
    secrets:
      - anthropic_api_key
      - slack_bot_token
      - todoist_api_key
      - habitsync_password
      - telegram_bot_token
      - oura_token
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  kai-council-api:
    build: ./kai-council-api
    container_name: kai-council-api
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - /home/leo/vault:/vault:rw
    env_file:
      - .env
    secrets:
      - anthropic_api_key
      - slack_bot_token
      - tavily_api_key
      - oura_token
      - plane_api_token
    depends_on:
      kai-worker-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  kai-slack-bot:
    build: ./kai-slack-bot
    container_name: kai-slack-bot
    restart: unless-stopped
    secrets:
      - slack_bot_token
      - slack_app_token
    depends_on:
      kai-council-api:
        condition: service_healthy

  kai-web:
    build: ./kai-web
    container_name: kai-web
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      kai-worker-api:
        condition: service_healthy
      kai-council-api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: kai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./n8n-data:/home/node/.n8n
      - /home/leo/vault:/vault:rw
    env_file:
      - .env
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=https://n8n.sonicink.space
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=kai
      - N8N_BASIC_AUTH_PASSWORD=sonicink_n8n_2026
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=America/New_York
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    secrets:
      - cloudflare_tunnel_token
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/cloudflare_tunnel_token
    depends_on:
      kai-worker-api:
        condition: service_healthy
      kai-council-api:
        condition: service_healthy

  kai-scheduler:
    build: ./kai-worker-api
    container_name: kai-scheduler
    restart: unless-stopped
    command: python scheduler.py
    environment:
      - TZ=America/New_York
    volumes:
      - /home/leo/vault:/vault:rw
    env_file:
      - .env
    secrets:
      - anthropic_api_key
      - slack_bot_token
      - todoist_api_key
      - telegram_bot_token
      - oura_token
    depends_on:
      kai-worker-api:
        condition: service_healthy

  kai-habitsync:
    image: ghcr.io/jofoerster/habitsync:latest
    container_name: kai-habitsync
    restart: unless-stopped
    env_file:
      - .env.habitsync
    volumes:
      - habitsync_data:/data
    ports:
      - "6842:6842"

  kai-ollama:
    image: ollama/ollama:latest
    container_name: kai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:
  habitsync_data:
  ollama_data:

secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  slack_bot_token:
    file: ./secrets/slack_bot_token.txt
  slack_app_token:
    file: ./secrets/slack_app_token.txt
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token.txt
  todoist_api_key:
    file: ./secrets/todoist_api_key.txt
  habitsync_password:
    file: ./secrets/habitsync_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  tavily_api_key:
    file: ./secrets/tavily_api_key.txt
  plane_api_token:
    file: ./secrets/plane_api_token.txt
  oura_token:
    file: ./secrets/oura_token.txt

