server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;

    auth_basic "KAI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # GitHub push webhook — no auth (GitHub servers cannot authenticate)
    location /api/github/webhook {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/github/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Slack Events API — no auth (Slack servers cannot authenticate)
    location /api/slack/events {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/slack/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Telegram webhook — no auth (Telegram servers cannot authenticate)
    location /api/telegram/webhook {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy worker API
    location /api/ {
        set $worker kai-worker-api;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$worker:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy council API
    location /council/ {
        set $council kai-council-api;
        rewrite ^/council/(.*) /$1 break;
        proxy_pass http://$council:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Webhook-only server block — for Cloudflare Tunnel ingress only
# Exposes nothing except the GitHub push webhook
server {
    listen 8080;
    resolver 127.0.0.11 valid=30s;

    location /api/github/webhook {
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/github/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 403;
    }
}
