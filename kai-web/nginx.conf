server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=30s;
    js_import worker_auth from /etc/nginx/njs/worker_auth.js;
    js_set $worker_authorization worker_auth.authorization;

    auth_basic "KAI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # GitHub push webhook — no auth (GitHub servers cannot authenticate)
    location /api/github/webhook {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/github/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Slack Events API — no auth (Slack servers cannot authenticate)
    location /api/slack/events {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/slack/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Telegram webhook — no auth (Telegram servers cannot authenticate)
    location /api/telegram/webhook {
        auth_basic off;
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy worker API
    location /api/ {
        set $worker kai-worker-api;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$worker:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The value is calculated in memory from the Docker secret mount. The
        # nginx config contains only this variable reference.
        proxy_set_header Authorization $worker_authorization;
    }


    # Proxy orchestrator API
    location /orchestrator/ {
        set $orch kai-orchestrator;
        rewrite ^/orchestrator/(.*) /$1 break;
        proxy_pass http://$orch:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy council API
    location /council/ {
        set $council kai-council-api;
        rewrite ^/council/(.*) /$1 break;
        proxy_pass http://$council:8002;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Webhook + Kiosk server block — Cloudflare Tunnel webhooks + LAN kiosk (no auth)
# Webhooks: each endpoint verifies its own signature server-side
# Kiosk: Tailscale-gated at network level, no application auth required
server {
    listen 8080;
    resolver 127.0.0.11 valid=30s;

    location /api/github/webhook {
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/github/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Slack interactivity callback for KAI Mode Lock approvals.
    # Worker verifies X-Slack-Signature — safe to expose unauthenticated.
    location = /mode_lock/slack_callback {
        set $worker kai-worker-api;
        proxy_pass http://$worker:8001/mode_lock/slack_callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public kiosk shell. Data access below is deny-by-default and read-only.
    location = /kiosk.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Public kiosk data: exact-path, GET-only allowlist.
    location = /kiosk-api/invariants/state {
        limit_except GET { deny all; }
        set $orch kai-orchestrator;
        proxy_pass http://$orch:8003/invariants/state;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /kiosk-api/cost-summary {
        limit_except GET { deny all; }
        set $orch kai-orchestrator;
        proxy_pass http://$orch:8003/cost-summary;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /kiosk-api/status {
        limit_except GET { deny all; }
        set $orch kai-orchestrator;
        proxy_pass http://$orch:8003/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /kiosk-api/jobs {
        limit_except GET { deny all; }
        set $orch kai-orchestrator;
        proxy_pass http://$orch:8003/jobs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # No other orchestrator route is exposed through the public kiosk origin.
    location ^~ /kiosk-api/ {
        return 404;
    }

    location / {
        return 403;
    }
}
