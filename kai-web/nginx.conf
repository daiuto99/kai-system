server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    auth_basic "KAI";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Telegram webhook — no auth (Telegram servers cannot authenticate)
    location /api/telegram/webhook {
        auth_basic off;
        proxy_pass http://kai-worker-api:8001/telegram/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy worker API
    location /api/ {
        proxy_pass http://kai-worker-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy council API
    location /council/ {
        proxy_pass http://kai-council-api:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
